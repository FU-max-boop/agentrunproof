version: 2

updates:
  # Keep Dependabot's auto-created dependencies and ecosystem labels.
  - package-ecosystem: pip
    directory: /
    exclude-paths:
      - requirements/history/**
      - requirements/upstream/**
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
